<!-- @dsCard group="Spacing" viewport="700x210" name="Spacing" subtitle="4px 基准的间距阶梯 50–1000" -->
<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--s2-background-base); font-family:var(--s2-font-sans); }
  .row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .tag { width:96px; flex:none; font-family:var(--s2-font-code); font-size:10px; color:var(--s2-text-subdued); }
  .bar { height:12px; border-radius:2px; background:var(--s2-accent-bg); }
</style></head>
<body>
  <div class="row"><span class="tag">50 · 2</span><div class="bar" style="width:var(--s2-space-50)"></div></div>
  <div class="row"><span class="tag">75 · 4</span><div class="bar" style="width:var(--s2-space-75)"></div></div>
  <div class="row"><span class="tag">100 · 8</span><div class="bar" style="width:var(--s2-space-100)"></div></div>
  <div class="row"><span class="tag">200 · 12</span><div class="bar" style="width:var(--s2-space-200)"></div></div>
  <div class="row"><span class="tag">300 · 16</span><div class="bar" style="width:var(--s2-space-300)"></div></div>
  <div class="row"><span class="tag">400 · 24</span><div class="bar" style="width:var(--s2-space-400)"></div></div>
  <div class="row"><span class="tag">500 · 32</span><div class="bar" style="width:var(--s2-space-500)"></div></div>
  <div class="row"><span class="tag">600 · 40</span><div class="bar" style="width:var(--s2-space-600)"></div></div>
  <div class="row"><span class="tag">700 · 48</span><div class="bar" style="width:var(--s2-space-700)"></div></div>
</body></html>
