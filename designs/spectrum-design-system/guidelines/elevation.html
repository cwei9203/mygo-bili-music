<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px; background:var(--s2-background-base); font-family:var(--s2-font-sans); }
  .row { display:flex; gap:24px; }
  .box { flex:1; height:80px; display:grid; place-items:center; border-radius:10px; background:var(--s2-background-layer-2); font-size:11px; font-family:var(--s2-font-code); color:var(--s2-text-subdued); }
</style></head>
<body>
  <div class="row">
    <div class="box" style="box-shadow:var(--s2-shadow-emphasized)">shadow-emphasized</div>
    <div class="box" style="box-shadow:var(--s2-shadow-elevated)">shadow-elevated</div>
  </div>
</body></html>
