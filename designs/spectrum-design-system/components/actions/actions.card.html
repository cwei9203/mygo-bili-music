<!-- @dsCard group="Components" viewport="700x330" name="Actions" subtitle="Button 的变体与尺寸、IconButton" -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--s2-background-base); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--s2-text-subdued); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, IconButton } = window.SpectrumDesignSystem_a44d86;

function ActionsCard() {
  return (
    <div>
      <div className="label">Variants</div>
      <div className="row">
        <Button variant="primary">主要操作</Button>
        <Button variant="secondary">次要操作</Button>
        <Button variant="accent" icon="add">新建</Button>
        <Button variant="negative">删除</Button>
        <Button variant="primary" fillStyle="outline">描边</Button>
      </div>

      <div className="label">Sizes</div>
      <div className="row">
        <Button size="S">Small 24</Button>
        <Button size="M">Medium 32</Button>
        <Button size="L">Large 40</Button>
        <Button size="XL">XLarge 48</Button>
      </div>

      <div className="label">States</div>
      <div className="row">
        <Button variant="accent" disabled>已禁用</Button>
        <Button variant="secondary" icon="play">播放全部</Button>
        <Button variant="quiet">安静按钮</Button>
        <IconButton icon="more" label="更多" />
        <IconButton icon="settings" label="设置" variant="secondary" />
        <IconButton icon="close" label="关闭" size="S" />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ActionsCard />);
</script>
</body>
</html>
