<!-- @dsCard group="Components" viewport="700x470" name="Feedback" subtitle="Badge、ProgressBar、Dialog、Toast" -->
<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--s2-background-base); }
  .label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--s2-text-subdued); margin: 0 0 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: start; }
  .demo-dialog .s2-dialog-overlay { position: static; padding: 0; background: transparent; display: block; }
  .demo-dialog .s2-dialog { width: 100%; padding: 20px; box-shadow: var(--s2-shadow-elevated); }
  .demo-toast .s2-toast-region { position: static; transform: none; width: auto; max-width: none; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Badge, ProgressBar, Dialog, Toast, Button } = window.SpectrumDesignSystem_a44d86;

function FeedbackCard() {
  return (
    <div>
      <div className="label">Badges</div>
      <div className="row">
        <Badge>中性</Badge>
        <Badge variant="accent">4 个分P</Badge>
        <Badge variant="positive">已收藏</Badge>
        <Badge variant="notice">处理中</Badge>
        <Badge variant="negative">加载失败</Badge>
        <Badge variant="accent" fillStyle="subtle">subtle</Badge>
        <Badge variant="negative" fillStyle="subtle">412</Badge>
      </div>

      <div className="label">Progress</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16, marginBottom: 22 }}>
        <ProgressBar label="读取合集中" value={42} showValue />
        <ProgressBar label="正在搜索 B 站" isIndeterminate />
      </div>

      <div className="cols">
        <div className="demo-dialog">
          <div className="label">Dialog</div>
          <Dialog
            isOpen
            title="删除「夜航」？"
            footer={
              <>
                <Button variant="secondary" size="S">取消</Button>
                <Button variant="negative" size="S">删除</Button>
              </>
            }
          >
            列表里的 4 首歌不会被删除，只是不再出现在这个列表里。
          </Dialog>
        </div>
        <div className="demo-toast">
          <div className="label">Toast</div>
          <Toast
            toasts={[
              { id: 'a', message: '已加入「夜航」 · 3 首', actionLabel: '撤销' },
              { id: 'b', message: 'B 站返回 412，已停止重试' },
            ]}
          />
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FeedbackCard />);
</script>
</body>
</html>
