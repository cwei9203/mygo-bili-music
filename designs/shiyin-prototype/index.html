<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>拾音 · 交互原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f0eee9;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ───────────────────────── app shell ───────────────────────── */
  .app {
    --rail: 238px;
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    container-type: inline-size;
    container-name: app;
    outline: none;
  }

  .app[data-skin="catalog"] {
    --bg: #f1ebdf;
    --rail-bg: #e9e0cf;
    --raised: #fbf7ed;
    --ink: #1a1611;
    --ink-2: rgba(26, 22, 17, .63);
    --ink-3: rgba(26, 22, 17, .42);
    --rule: rgba(26, 22, 17, .14);
    --rule-strong: rgba(26, 22, 17, .34);
    --accent: #a8432a;
    --on-accent: #f8f2e8;
    --hover: rgba(26, 22, 17, .045);
    --font-display: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --row-h: 54px;
    --player-h: 88px;
    --radius: 2px;
  }

  .app[data-skin="radio"] {
    --bg: #0b0b0d;
    --rail-bg: #0e0e11;
    --raised: #16151a;
    --ink: #f2ece2;
    --ink-2: rgba(242, 236, 226, .58);
    --ink-3: rgba(242, 236, 226, .34);
    --rule: rgba(255, 255, 255, .09);
    --rule-strong: rgba(255, 255, 255, .2);
    --accent: #e9a24b;
    --on-accent: #171006;
    --hover: rgba(255, 255, 255, .045);
    --font-display: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --row-h: 60px;
    --player-h: 96px;
    --radius: 8px;
  }

  .app[data-skin="tool"] {
    --bg: #f7f7f4;
    --rail-bg: #efefeb;
    --raised: #ffffff;
    --ink: #151515;
    --ink-2: rgba(21, 21, 21, .6);
    --ink-3: rgba(21, 21, 21, .38);
    --rule: rgba(21, 21, 21, .11);
    --rule-strong: rgba(21, 21, 21, .26);
    --accent: #151515;
    --on-accent: #ffffff;
    --hover: rgba(21, 21, 21, .04);
    --font-display: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --row-h: 34px;
    --player-h: 58px;
    --radius: 4px;
    font-size: 12.5px;
  }

  .body { display: flex; flex: 1; min-height: 0; }

  /* ───────────────────────── rail ───────────────────────── */
  .rail {
    width: var(--rail);
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px 16px 16px;
    background: var(--rail-bg);
    border-right: 1px solid var(--rule);
    overflow-y: auto;
    overflow-x: hidden;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; }
  .brand-seal {
    width: 28px; height: 28px; flex: none;
    display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent);
    font-family: var(--font-display); font-size: 15px; font-weight: 700;
    border-radius: var(--radius);
  }
  .brand-name {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .06em;
    line-height: 1.1;
  }
  .brand-tag {
    display: block;
    font-family: var(--font-ui);
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: .14em;
    color: var(--ink-3);
    margin-top: 3px;
  }

  .searchbox {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    color: var(--ink-3);
  }
  .searchbox.is-focus { border-color: var(--rule-strong); color: var(--ink-2); }
  .searchbox input {
    flex: 1; min-width: 0;
    border: 0; background: transparent; outline: none;
    color: var(--ink); font: inherit; font-size: 13px;
  }
  .searchbox input::placeholder { color: var(--ink-3); }
  .searchbox kbd {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-3);
    border: 1px solid var(--rule); border-radius: 3px; padding: 1px 4px;
  }

  .rail-sec { display: flex; flex-direction: column; gap: 2px; }
  .rail-title {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-3); padding: 0 8px; margin-bottom: 6px;
  }
  .navitem {
    display: flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 8px;
    border: 0; background: transparent; border-radius: var(--radius);
    color: var(--ink-2); text-align: left; cursor: pointer;
    white-space: nowrap; overflow: hidden;
  }
  .navitem:hover { background: var(--hover); color: var(--ink); }
  .navitem.is-active { background: var(--sel, rgba(0,0,0,.07)); color: var(--ink); }
  .navitem .num {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); width: 16px; flex: none;
  }
  .navitem .nm {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    font-size: 13px;
  }
  .navitem .ct { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }

  .newlist {
    display: flex; align-items: center; gap: 6px;
    height: 28px; margin-top: 4px; padding: 0 8px;
    border: 0; background: transparent; border-radius: var(--radius);
    color: var(--ink-3); cursor: pointer; font-size: 12.5px; text-align: left;
  }
  .newlist:hover { color: var(--ink); background: var(--hover); }

  .rail-foot {
    margin-top: auto; padding: 12px 8px 0;
    border-top: 1px solid var(--rule);
    font-size: 10.5px; line-height: 1.7; color: var(--ink-3);
  }
  .rail-foot b { font-weight: 500; color: var(--ink-2); }

  /* ───────────────────────── main ───────────────────────── */
  .main {
    flex: 1; min-width: 0;
    overflow-y: auto;
    padding: 34px 44px 40px;
    scrollbar-width: thin;
  }
  .mainhead { padding-bottom: 18px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 12px;
  }
  .display {
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }
  .headmeta {
    display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center;
    margin-top: 12px; color: var(--ink-2); font-size: 12.5px;
  }
  .headmeta .dot { color: var(--ink-3); }

  .toolbar {
    position: sticky; top: -34px; z-index: 3;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 0;
    background: var(--bg);
    border-bottom: 1px solid var(--rule-strong);
    margin-bottom: 2px;
  }
  .toolbar .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    height: 32px; padding: 0 12px;
    border: 1px solid var(--rule-strong);
    background: transparent; color: var(--ink);
    border-radius: var(--radius);
    font-size: 12.5px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn-primary {
    background: var(--ink); color: var(--bg); border-color: var(--ink);
  }
  .btn-primary:hover { background: var(--ink); opacity: .88; }
  .btn-ghost { border-color: transparent; color: var(--ink-2); }
  .btn-ghost:hover { color: var(--ink); background: var(--hover); }
  .btn-danger { color: var(--accent); border-color: var(--accent); }
  .btn-sm { height: 26px; padding: 0 9px; font-size: 11.5px; }
  .btn:disabled { opacity: .38; cursor: not-allowed; }

  .display-input {
    display: block;
    width: 100%;
    margin: 0;
    padding: 0 0 4px;
    border: 0;
    border-bottom: 1px solid var(--accent);
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-family: var(--font-display);
    font-size: 44px;
    font-weight: 700;
    line-height: 1.06;
    letter-spacing: -.015em;
    outline: none;
  }

  .count {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3);
    letter-spacing: .04em;
  }

  /* ───────────────────────── list ───────────────────────── */
  .list { border-top: 1px solid var(--rule); }
  .listhead {
    display: none; gap: 12px; align-items: center;
    height: 26px; padding: 0 10px;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3);
    border-bottom: 1px solid var(--rule);
  }
  .listhead .h-title { flex: 1; }
  .listhead .h-dur { width: 52px; text-align: right; }
  .listhead .h-act { width: 26px; }

  .row {
    display: flex; align-items: center; gap: 13px;
    height: var(--row-h);
    padding: 0 10px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
    position: relative;
    transition: background .12s;
  }
  .row:hover { background: var(--hover); }
  .row.is-playing { background: var(--sel, rgba(0,0,0,.05)); }
  .row.is-playing .row-title { color: var(--accent); }
  .row.is-playing::before {
    content: ""; position: absolute; left: 0; top: 9px; bottom: 9px;
    width: 2px; background: var(--accent);
  }
  .row-index {
    width: 54px; flex: none;
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .02em; white-space: nowrap;
  }
  .row-grip {
    width: 14px; flex: none; color: var(--ink-3); cursor: grab; opacity: 0;
    display: flex; align-items: center;
  }
  .row:hover .row-grip { opacity: 1; }

  .cover {
    flex: none; display: grid; place-items: center;
    width: 28px; height: 28px;
    border-radius: var(--radius);
    color: rgba(255,255,255,.94);
    font-family: var(--font-display); font-size: 13px; font-weight: 700;
    overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
  }
  .cover-lg { width: 44px; height: 44px; font-size: 18px; }

  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .row-title {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 14px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-part {
    flex: none; font-family: var(--font-mono); font-size: 9.5px;
    color: var(--ink-3); border: 1px solid var(--rule);
    padding: 0 4px; border-radius: 2px; line-height: 1.5;
  }
  .row-sub {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-bv { display: none; font-family: var(--font-mono); font-size: 10px; }
  .row-dur {
    width: 52px; flex: none; text-align: right;
    font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-3);
  }

  .row-act {
    width: 26px; height: 26px; flex: none;
    display: grid; place-items: center;
    border: 0; background: transparent; border-radius: var(--radius);
    color: var(--ink-3); cursor: pointer; opacity: 0;
  }
  .row:hover .row-act, .row-act:focus-visible { opacity: 1; }
  .row-act:hover { background: var(--sel, rgba(0,0,0,.08)); color: var(--ink); }
  .result .row-act, .part .row-act { opacity: .45; }
  .result:hover .row-act, .part:hover .row-act { opacity: 1; }

  .check {
    width: 20px; height: 20px; flex: none;
    display: grid; place-items: center;
    border: 1px solid var(--rule-strong);
    background: transparent; border-radius: 3px;
    color: transparent; cursor: pointer;
  }
  .check.is-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .check.is-partial { border-color: var(--accent); color: var(--accent); }

  /* ───────────────────────── search ───────────────────────── */
  .result {
    display: flex; align-items: center; gap: 13px;
    padding: 11px 10px;
    border-bottom: 1px solid var(--rule);
    cursor: pointer;
  }
  .result:hover { background: var(--hover); }
  .result .row-main { gap: 2px; }
  .badge {
    flex: none; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em;
    color: var(--ink-2); border: 1px solid var(--rule-strong);
    padding: 1px 5px; border-radius: 2px;
  }
  .result-error { cursor: default; background: var(--sel, rgba(0,0,0,.03)); }
  .result-error .err-text { color: var(--accent); font-size: 12px; }

  .parts { padding-left: 52px; border-bottom: 1px solid var(--rule); }
  .part {
    display: flex; align-items: center; gap: 10px;
    height: 38px; padding: 0 10px 0 0;
    border-top: 1px dotted var(--rule);
    cursor: pointer;
  }
  .part:hover { background: var(--hover); }
  .part .p-name { flex: 1; min-width: 0; font-size: 12.5px; color: var(--ink-2); }

  .skeleton { height: 44px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; gap: 12px; padding: 0 10px; }
  .sk { background: var(--sel, rgba(0,0,0,.07)); border-radius: 2px; height: 10px; }

  .empty {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 10px; padding: 72px 24px;
  }
  .empty-mark {
    width: 46px; height: 46px; display: grid; place-items: center;
    border: 1px solid var(--rule-strong); color: var(--ink-3);
    font-family: var(--font-display); font-size: 19px;
    border-radius: var(--radius); margin-bottom: 4px;
  }
  .empty h3 { margin: 0; font-family: var(--font-display); font-size: 19px; font-weight: 700; }
  .empty p { margin: 0; color: var(--ink-3); font-size: 12.5px; max-width: 34ch; }

  /* ───────────────────────── player ───────────────────────── */
  .player {
    flex: none;
    height: var(--player-h);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, .8fr);
    align-items: center;
    gap: 20px;
    padding: 0 22px;
    background: var(--raised);
    border-top: 1px solid var(--rule-strong);
    z-index: 6;
  }
  .app[data-skin="radio"] .player {
    box-shadow: 0 -40px 80px rgba(233,162,75,.06);
  }
  .np { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .np-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .np-title {
    font-size: 13.5px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-sub {
    font-size: 11px; color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-center { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; width: 100%; }
  .controls { display: flex; align-items: center; gap: 4px; }
  .ctrl {
    width: 30px; height: 30px; display: grid; place-items: center;
    border: 0; background: transparent; border-radius: 50%;
    color: var(--ink-2); cursor: pointer;
  }
  .ctrl:hover { background: var(--hover); color: var(--ink); }
  .ctrl.is-on { color: var(--accent); }
  .ctrl-play {
    width: 36px; height: 36px; margin: 0 4px;
    background: var(--ink); color: var(--bg); border-radius: 50%;
  }
  .ctrl-play:hover { background: var(--ink); color: var(--bg); opacity: .85; }
  .mode-btn {
    height: 26px; padding: 0 8px;
    display: inline-flex; align-items: center; gap: 5px;
    border: 0; background: transparent; border-radius: var(--radius);
    color: var(--ink-3); font-size: 11px; cursor: pointer;
  }
  .mode-btn:hover { background: var(--hover); color: var(--ink-2); }

  .progress { display: flex; align-items: center; gap: 9px; width: 100%; max-width: 460px; }
  .time { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); flex: none; }
  .pbar { flex: 1; height: 14px; display: flex; align-items: center; cursor: pointer; }
  .pbar-track { position: relative; width: 100%; height: 3px; background: var(--rule); }
  .pbar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .pbar-knob {
    position: absolute; top: 50%; width: 7px; height: 7px; margin-top: -3.5px;
    background: var(--ink); border-radius: 50%; transform: translateX(-50%); opacity: 0;
  }
  .pbar:hover .pbar-knob { opacity: 1; }

  .np-right { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }

  .player.is-error .np-title { color: var(--accent); }
  .retry-strip {
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px; color: var(--accent);
  }

  /* ───────────────────────── queue ───────────────────────── */
  .queue {
    position: absolute; top: 0; right: 0; bottom: var(--player-h);
    width: 320px; z-index: 5;
    display: flex; flex-direction: column;
    background: var(--raised);
    border-left: 1px solid var(--rule-strong);
    box-shadow: -24px 0 60px rgba(0,0,0,.10);
  }
  .queue-head {
    display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 14px; flex: none;
    border-bottom: 1px solid var(--rule);
  }
  .queue-head h4 { margin: 0; font-size: 12px; letter-spacing: .06em; font-weight: 600; }
  .queue-body { flex: 1; overflow-y: auto; padding: 10px 0 16px; }
  .queue-label {
    padding: 10px 14px 6px; font-family: var(--font-mono);
    font-size: 9.5px; letter-spacing: .16em; color: var(--ink-3); text-transform: uppercase;
  }
  .qrow {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; cursor: pointer; border: 0; background: transparent;
    width: 100%; text-align: left;
  }
  .qrow:hover { background: var(--hover); }
  .qrow.is-playing .qrow-title { color: var(--accent); }
  .qrow-main { flex: 1; min-width: 0; }
  .qrow-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qrow-sub { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ───────────────────────── batch bar + toast ───────────────────────── */
  .batchbar {
    position: absolute; left: 50%; bottom: calc(var(--player-h) + 14px);
    transform: translateX(-50%); z-index: 7;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 8px 14px;
    background: var(--ink); color: var(--bg);
    border-radius: var(--radius);
    box-shadow: 0 10px 34px rgba(0,0,0,.22);
    white-space: nowrap;
  }
  .batchbar .n { font-size: 12px; margin-right: 4px; }
  .batchbar .btn { border-color: rgba(255,255,255,.28); color: inherit; height: 28px; }
  .batchbar .btn:hover { background: rgba(255,255,255,.12); }
  .batchbar .btn-primary { background: var(--bg); color: var(--ink); border-color: var(--bg); }
  .batchbar .btn-ghost { border-color: transparent; color: rgba(255,255,255,.6); }
  .menu-wrap { position: relative; }
  .menu {
    position: absolute; bottom: calc(100% + 8px); right: 0;
    min-width: 170px; padding: 4px;
    background: var(--raised); color: var(--ink);
    border: 1px solid var(--rule-strong); border-radius: var(--radius);
    box-shadow: 0 12px 34px rgba(0,0,0,.18);
  }
  .menu button {
    display: block; width: 100%; padding: 7px 9px;
    border: 0; background: transparent; border-radius: 2px;
    text-align: left; font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .menu button:hover { background: var(--hover); }

  .toast {
    position: absolute; left: 18px; bottom: calc(var(--player-h) + 16px); z-index: 8;
    display: flex; align-items: center; gap: 12px;
    padding: 9px 12px;
    background: var(--ink); color: var(--bg);
    border-radius: var(--radius);
    font-size: 12.5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
    animation: toast-in .18s ease-out;
  }
  @keyframes toast-in { from { opacity: 0; transform: translateY(6px); } }
  .toast button {
    border: 0; background: transparent; color: inherit;
    font-size: 12px; font-weight: 600; cursor: pointer;
    text-decoration: underline; text-underline-offset: 3px; padding: 0;
  }

  /* ───────────────────────── skin: catalog ───────────────────────── */
  .app[data-skin="catalog"] .display { letter-spacing: -.01em; }
  .app[data-skin="catalog"] .row-index::before { content: "SY-"; }
  .app[data-skin="catalog"] .listhead .h-num { width: 38px; flex: none; }
  .app[data-skin="catalog"] .brand-seal { border-radius: 1px; }
  .app[data-skin="catalog"] .mainhead { border-bottom: 1px solid var(--rule); }
  .app[data-skin="catalog"] .row-title { font-family: var(--font-display); font-size: 15.5px; }

  /* ───────────────────────── skin: radio ───────────────────────── */
  .app[data-skin="radio"] .display { letter-spacing: -.035em; font-size: 42px; }
  .app[data-skin="radio"] .eyebrow { color: var(--accent); opacity: .8; }
  .app[data-skin="radio"] .row-index { display: none; }
  .app[data-skin="radio"] .cover { width: 42px; height: 42px; font-size: 17px; box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 6px 18px rgba(0,0,0,.4); }
  .app[data-skin="radio"] .row-title { font-size: 14.5px; }
  .app[data-skin="radio"] .row.is-playing::before { width: 3px; top: 14px; bottom: 14px; }
  .app[data-skin="radio"] .mainhead { position: relative; }
  .app[data-skin="radio"] .mainhead::after {
    content: ""; position: absolute; left: -44px; top: -90px;
    width: 460px; height: 300px; pointer-events: none;
    background: radial-gradient(closest-side, rgba(233,162,75,.10), transparent 72%);
  }
  .app[data-skin="radio"] .toolbar { border-bottom-color: rgba(255,255,255,.16); }
  .app[data-skin="radio"] .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .app[data-skin="radio"] .ctrl-play { background: var(--accent); color: var(--on-accent); }
  .app[data-skin="radio"] .ctrl-play:hover { background: var(--accent); color: var(--on-accent); }
  .app[data-skin="radio"] .row-act:hover { background: rgba(255,255,255,.1); }
  .app[data-skin="radio"] .list { border-top-color: var(--rule); }

  /* ───────────────────────── skin: tool ───────────────────────── */
  .app[data-skin="tool"] .display { font-size: 21px; font-weight: 600; letter-spacing: -.005em; }
  .app[data-skin="tool"] .main { padding: 22px 26px 28px; }
  .app[data-skin="tool"] .mainhead { display: flex; align-items: baseline; gap: 12px; padding-bottom: 14px; }
  .app[data-skin="tool"] .eyebrow { display: none; }
  .app[data-skin="tool"] .headmeta { margin-top: 0; }
  .app[data-skin="tool"] .toolbar { top: -22px; padding: 8px 0; }
  .app[data-skin="tool"] .row { gap: 10px; }
  .app[data-skin="tool"] .cover { display: none; }
  .app[data-skin="tool"] .row-index { width: 30px; }
  .app[data-skin="tool"] .row-index::before { content: ""; }
  .app[data-skin="tool"] .row-index::after { content: "."; }
  .app[data-skin="tool"] .row-title { font-size: 12.5px; }
  .app[data-skin="tool"] .row-sub { font-size: 10.5px; }
  .app[data-skin="tool"] .row-bv { display: inline; }
  .app[data-skin="tool"] .row-dur { width: 44px; font-size: 10.5px; }
  .app[data-skin="tool"] .row.is-playing::before { top: 6px; bottom: 6px; width: 2px; }
  .app[data-skin="tool"] .row.is-playing .row-title { color: var(--ink); font-weight: 600; }
  .app[data-skin="tool"] .row.is-playing .row-index { color: var(--accent); }
  .app[data-skin="tool"] .listhead {
    display: flex; height: 22px; gap: 10px;
    border-bottom: 1px solid var(--rule-strong);
  }
  .app[data-skin="tool"] .listhead .h-num { width: 30px; flex: none; margin-left: 24px; }
  .app[data-skin="tool"] .listhead .h-dur { width: 44px; }
  .app[data-skin="tool"] .navitem { height: 26px; }
  .app[data-skin="tool"] .btn { height: 26px; font-size: 11.5px; }
  .app[data-skin="tool"] .ctrl-play { width: 30px; height: 30px; }
  .app[data-skin="tool"] .ctrl { width: 26px; height: 26px; }

  /* ───────────────────────── narrow window ───────────────────────── */
  @container app (max-width: 880px) {
    .body { flex-direction: column; }
    .rail {
      width: 100%;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-right: 0;
      border-bottom: 1px solid var(--rule);
      overflow-x: auto;
      overflow-y: hidden;
      flex: none;
    }
    .brand { padding: 0; }
    .brand-tag { display: none; }
    .brand-name { display: none; }
    .searchbox { flex: 1 1 120px; min-width: 110px; }
    .searchbox kbd { display: none; }
    .rail-sec { flex-direction: row; gap: 6px; align-items: center; flex: none; }
    .rail-title { display: none; }
    .navitem {
      flex: 0 0 auto;
      height: 28px; padding: 0 10px;
      border: 1px solid var(--rule); border-radius: 999px;
      background: var(--raised);
    }
    .navitem .nm { flex: none; overflow: visible; text-overflow: clip; font-size: 12px; }
    .navitem .num, .navitem .ct { display: none; }
    .newlist { margin-top: 0; border: 1px dashed var(--rule-strong); border-radius: 999px; height: 28px; padding: 0 10px; }
    .rail-foot { display: none; }

    .main { padding: 18px 14px 24px; }
    .display { font-size: 30px; }
    .toolbar { top: -18px; padding: 9px 0; gap: 6px; }
    .headmeta { font-size: 11.5px; gap: 4px 10px; }

    .row { gap: 10px; padding: 0 6px; height: 56px; }
    .row-index { display: none; }
    .row-grip { display: none; }
    .row-title { font-size: 14px; }
    .row-sub .row-bv { display: none; }
    .listhead { display: none; }
    .check { width: 22px; height: 22px; }

    .player {
      height: 108px;
      padding: 8px 12px;
      gap: 2px 8px;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto auto;
    }
    .np { grid-column: 1; grid-row: 1; gap: 9px; }
    .np .cover { width: 32px; height: 32px; font-size: 13px; }
    .np-sub { display: none; }
    .np-center { display: contents; }
    .controls { grid-column: 1 / -1; grid-row: 2; gap: 0; justify-content: center; }
    .progress { grid-column: 1 / -1; grid-row: 3; max-width: none; }
    .progress .time { display: none; }
    .np-right { grid-column: 2; grid-row: 1; justify-self: end; gap: 2px; }
    .mode-label { display: none; }
    .ctrl-play { width: 32px; height: 32px; }

    .queue { width: 100%; bottom: 0; }
    .batchbar { left: 10px; right: 10px; transform: none; bottom: 118px; overflow-x: auto; }
    .toast { left: 10px; right: 10px; bottom: 118px; }
    .parts { padding-left: 12px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

<script type="text/babel">
  function Boot() {
    const params = new URLSearchParams(location.search);
    if (params.get('app')) {
      return (
        <div style={{ width: '100vw', height: '100vh' }}>
          <App skin={params.get('skin') || 'catalog'} />
        </div>
      );
    }
    // 首次进来把三个 1440 宽的画板放进一屏；之后沿用画布记住的视口
    const vpKey = 'dc-viewport:' + location.pathname;
    if (!localStorage.getItem(vpKey)) {
      const scale = Math.min(0.4, (window.innerWidth - 160) / (3 * 1440 + 160));
      try { localStorage.setItem(vpKey, JSON.stringify({ x: 80, y: 120, scale })); } catch {}
    }
    return (
      <DesignCanvas>
        <DCSection id="directions" title="三个方向" subtitle="同一套信息架构，三种视觉世界 · 都可以直接点">
          <DCArtboard id="catalog" label="A · 唱片架" width={1440} height={900}>
            <App skin="catalog" />
          </DCArtboard>
          <DCArtboard id="radio" label="B · 深夜电台" width={1440} height={900}>
            <App skin="radio" />
          </DCArtboard>
          <DCArtboard id="tool" label="C · 工具台" width={1440} height={900}>
            <App skin="tool" />
          </DCArtboard>
        </DCSection>
        <DCSection id="narrow" title="窄窗" subtitle="390 px · 唱片架方向的自适应">
          <DCArtboard id="narrow" label="D · 窄窗 390" width={390} height={844}>
            <App skin="catalog" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Boot />);
</script>
</body>
</html>
